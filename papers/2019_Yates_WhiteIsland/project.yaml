msnoise_project_version: 1
# Yates et al. (2019) - Geophys. Res. Lett. doi:10.1029/2018GL080580
# "Volcanic, Coseismic, and Seasonal Changes Detected at White Island
#  (Whakaari) Volcano, New Zealand, Using Seismic Ambient Noise"
# Network: NZ (GeoNet) — 7 broadband 3-component stations
# On-volcano: WIZ, WSRZ  |  Onshore reference: HAZ, MWZ, MXZ, OPRZ, PUZ
# Period: 2007-01-01 – 2017-01-01
# Approach: SC (single-station cross-component) + AC (autocorrelation)
#            2 frequency bands with different cc/mwcs parameters

global_1:
  startdate: "2007-01-01"
  enddate: "2017-01-01"
  output_folder: OUTPUT
  hpc: "N"

preprocess_1:
  after: global_1
  # Pre-filter wide enough to cover both bands; resampled to 10 Hz (thesis Table A.5)
  cc_sampling_rate: 10.0
  resampling_method: Decimate
  preprocess_highpass: 0.08
  preprocess_lowpass: 2.5
  preprocess_components: "E,N,Z"
  remove_response: "N"

data_sources:
  - name: geonet-fdsn
    uri: "fdsn://https://service.geonet.org.nz"
    network: "NZ"
    channels: "HH?"

stations:
  station_endpoint: "https://service.geonet.org.nz/fdsnws/station/1/query?network=NZ&station=WIZ,WSRZ,HAZ,MWZ,MXZ,OPRZ,PUZ&level=response"

# ── Band 1: 0.1–1.0 Hz ───────────────────────────────────────────────────────

cc_1:
  after: preprocess_1
  maxlag: 120.0
  corr_duration: 7200.0             # 2-hour slices (thesis Table A.5)
  overlap: 0.0
  winsorizing: 3.0                  # clip at 3× RMS (thesis Table A.5)
  # whitening="A" → applied to all except autocorrelations (MSNoise handles AC)
  whitening: "A"
  components_to_compute: ""
  components_to_compute_single_station: "EE,NN,ZZ,EN,EZ,NZ"
  keep_days: "Y"

filter_1:
  after: cc_1
  # Thesis Table A.6: whiten window 0.12–0.98 Hz
  freqmin: 0.12
  freqmax: 0.98
  CC: "N"
  SC: "Y"
  AC: "Y"

stack_1:
  after: filter_1
  stack_method: linear
  mov_stack: "(('10D','1D'))"       # 10-day moving stack (thesis Table A.5)

refstack_1:
  after: filter_1
  ref_begin: "2007-01-01"
  ref_end: "2017-01-01"
  stack_method: linear

mwcs_1:
  after: [stack_1, refstack_1]
  # Thesis Table A.6: MWCS regression band 0.14–0.96 Hz
  freqmin: 0.14
  freqmax: 0.96
  mwcs_wlen: 16.0                   # 16-s window (thesis Table A.6)
  mwcs_step: 4.0                    # 4-s step (thesis Table A.6)

mwcs_dtt_1:
  after: mwcs_1
  # Thesis Table A.5 (0.1–1.0 Hz band)
  dtt_lag: "static"
  dtt_v: 1.0
  dtt_minlag: 20.0                  # 20 s
  dtt_width: 60.0                   # window width → maxlag = 20+60 = 80 s
  dtt_sides: "both"
  dtt_mincoh: 0.8
  dtt_maxdtt: 0.4
  dtt_maxerr: 0.1

mwcs_dtt_dvv_1:
  after: mwcs_dtt_1

# ── Band 2: 1.0–2.0 Hz ───────────────────────────────────────────────────────

cc_2:
  after: preprocess_1
  maxlag: 120.0
  corr_duration: 14400.0            # 4-hour slices (thesis Table A.5)
  overlap: 0.0
  winsorizing: 3.0
  whitening: "A"
  components_to_compute: ""
  components_to_compute_single_station: "EE,NN,ZZ,EN,EZ,NZ"
  keep_days: "Y"

filter_2:
  after: cc_2
  # Thesis Table A.7: whiten window 1.02–1.98 Hz
  freqmin: 1.02
  freqmax: 1.98
  CC: "N"
  SC: "Y"
  AC: "Y"

stack_2:
  after: filter_2
  stack_method: linear
  mov_stack: "(('10D','1D'))"

refstack_2:
  after: filter_2
  ref_begin: "2007-01-01"
  ref_end: "2017-01-01"
  stack_method: linear

mwcs_2:
  after: [stack_2, refstack_2]
  # Thesis Table A.7: MWCS regression band 1.04–1.96 Hz
  freqmin: 1.04
  freqmax: 1.96
  mwcs_wlen: 12.0                   # 12-s window (thesis Table A.7)
  mwcs_step: 4.0

mwcs_dtt_2:
  after: mwcs_2
  # Thesis Table A.5 (1.0–2.0 Hz band)
  dtt_lag: "static"
  dtt_v: 1.0
  dtt_minlag: 10.0                  # 10 s
  dtt_width: 30.0                   # window width → maxlag = 10+30 = 40 s
  dtt_sides: "both"
  dtt_mincoh: 0.6
  dtt_maxdtt: 0.2
  dtt_maxerr: 0.1

mwcs_dtt_dvv_2:
  after: mwcs_dtt_2
