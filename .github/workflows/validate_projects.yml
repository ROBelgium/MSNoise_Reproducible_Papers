name: Validate project.yaml (MSNoise db init)

on:
  push:
    branches: [main]
    paths:
      - 'papers/**/project*.yaml'
      - '.github/workflows/validate_projects.yml'
  pull_request:
    paths:
      - 'papers/**/project*.yaml'
      - '.github/workflows/validate_projects.yml'

jobs:
  db-init:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MSNoise from master
        run: |
          pip install --upgrade pip
          pip install "git+https://github.com/ROBelgium/MSNoise.git@master#egg=msnoise"

      - name: Run db init for every project*.yaml
        run: |
          python3 - <<'PYEOF'
          import pathlib, subprocess, tempfile, sys

          root = pathlib.Path(".")
          yamls = sorted(root.glob("papers/**/project*.yaml"))

          if not yamls:
              print("No project*.yaml files found.")
              sys.exit(1)

          failures = []
          for yaml_path in yamls:
              print(f"\n── {yaml_path} ──")
              with tempfile.TemporaryDirectory() as tmpdir:
                  result = subprocess.run(
                      ["msnoise", "db", "init", "--tech", "1",
                       "--from-yaml", str(yaml_path.resolve())],
                      cwd=tmpdir,
                      capture_output=True, text=True,
                  )
                  print(result.stdout)
                  if result.returncode != 0:
                      print(result.stderr)
                      failures.append(str(yaml_path))
                      print(f"FAIL: {yaml_path}")
                  else:
                      print(f"OK:   {yaml_path}")

          if failures:
              print(f"\n{len(failures)} failure(s):")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          else:
              print(f"\nAll {len(yamls)} project file(s) passed.")
          PYEOF
