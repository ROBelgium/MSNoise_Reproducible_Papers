name: Validate project.yaml (MSNoise db init)

on:
  push:
    branches: [main]
    paths:
      - 'papers/**/project*.yaml'
      - 'scripts/check_projects.py'
      - '.github/workflows/validate_projects.yml'
  pull_request:
    paths:
      - 'papers/**/project*.yaml'
      - 'scripts/check_projects.py'
      - '.github/workflows/validate_projects.yml'

jobs:
  db-init:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MSNoise from master
        run: |
          pip install --upgrade pip
          pip install "git+https://github.com/ROBelgium/MSNoise.git@master#egg=msnoise"

      - name: Run db init for every project*.yaml
        run: python scripts/check_projects.py
