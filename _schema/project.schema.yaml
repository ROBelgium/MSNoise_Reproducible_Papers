      dvv_quality_min:
        type: number
        description: Minimum wavelet coherence (coh) to include a time-frequency cell before frequency averaging. Cells below
          this threshold are masked.
      dvv_split_pair_type:
        type: string
        enum:
        - Y
        - N
        description: Split dv/v by pair type (CC/SC/AC) separately. CC=inter-station; SC=same station different location;
          AC=autocorrelation.
      dvv_split_components:
        type: string
        enum:
        - Y
        - N
        description: Split dv/v by component pair (ZZ/RR/TT/etc) separately.
      dvv_weighted_mean:
        type: string
        enum:
        - Y
        - N
        description: Compute 1/err^2 weighted mean across pairs after frequency averaging.
      dvv_trimmed_mean:
        type: string
        enum:
        - Y
        - N
        description: 'Compute trimmed mean: reject pairs whose dv/v deviates more than dvv_trim_limit sigma from the mean.'
      dvv_trim_limit:
        type: number
        description: Sigma cutoff for trimmed mean.
      dvv_percentiles:
        type: string
        description: Comma-separated list of percentiles to save (e.g. 5,25,75,95).
      dvv_output_percent:
        type: string
        enum:
        - Y
        - N
        description: Output dv/v in percent.
  ^psd_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      psd_components:
        type: string
        description: Components to process for PSD, defaults to [E,N,Z], but can be any comma separated list (e.g. 'Z,E,N')
      psd_ppsd_length:
        type: number
        description: Length of data segments passed to psd in seconds. In the paper by McNamara et al (2004) a value of 3600
          (1 hour) was chosen. Longer segments increase the upper limit of analyzed periods but decrease t
      psd_ppsd_overlap:
        type: number
        description: Overlap of segments passed to psd. Overlap may take values between 0 and 1 and is given as fraction of
          the length of one segment, e.g. `psd_ppsd_length=3600` and `psd_ppsd_overlap=0.5` result in an ov
      psd_ppsd_period_smoothing_width_octaves:
        type: number
        description: Determines over what period/frequency range the psd is smoothed around every central period/frequency.
          Given in fractions of octaves (default of ``1`` means the psd is averaged over a full octave at e
      psd_ppsd_period_step_octaves:
        type: number
        description: Step length on frequency axis in fraction of octaves (default of ``0.125`` means one smoothed psd value
          on the frequency axis is measured every 1/8 of an octave).
      psd_ppsd_period_limits:
        type: string
        description: 'Set custom lower and upper end of period range (e.g. ``(0.01, 100)`` seconds). The specified lower end
          of period range will be set as the central period of the first bin (geometric mean of left/right '
      psd_ppsd_db_bins:
        type: string
        description: Specify the lower and upper boundary and the width of the db bins. The bin width might get adjusted to
          fit a number of equally spaced bins in between the given boundaries.
  ^psd_rms_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      psd_rms_frequency_ranges:
        type: string
        description: Specify the frequency bounds (in Hz) to compute the RMS from PSDs
