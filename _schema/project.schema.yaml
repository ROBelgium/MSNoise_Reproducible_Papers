# MSNoise project.yaml JSON Schema
# Auto-generated by scripts/generate_project_schema.py — do not edit manually.
# Regenerate after updating MSNoise: python scripts/generate_project_schema.py

$schema: https://json-schema.org/draft/2020-12/schema
title: MSNoise project.yaml
description: Validates an MSNoise 2.x project.yaml file. Auto-generated by scripts/generate_project_schema.py — do not edit
  manually.
type: object
required:
- msnoise_project_version
properties:
  msnoise_project_version:
    type: integer
    const: 1
    description: Must be 1.
  data_sources:
    type: array
    items:
      type: object
      required:
      - name
      - uri
      properties:
        name:
          type: string
          description: Unique source name; 'local' is reserved.
        uri:
          type: string
        data_structure:
          type: string
          enum:
          - SDS
          - PDF
        network:
          type: string
        channels:
          type: string
        auth_env:
          type: string
        archive_format:
          type:
          - string
          - 'null'
      additionalProperties: false
  stations:
    oneOf:
    - type: object
      properties:
        station_endpoint:
          type: string
      additionalProperties: true
    - type: array
      items:
        type: object
    description: 'Either {station_endpoint: url} or a list of station dicts.'
patternProperties:
  ^global_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      response_path:
        type: string
        description: Instrument correction file(s) location (path relative to db.ini), defaults to './inventory', i.e. a subfolder
          in the current project folder. All files in that folder will be parsed.
      startdate:
        type: string
        description: 'Start Date to process: [1970-01-01]=''since beginning of the archive'''
      enddate:
        type: string
        description: 'End Date to process: [2100-01-01]=''No end'''
      crondays:
        type: string
        description: Number of days to monitor with scan_archive, typically used in cron (should be a float representing a
          number of days, or a string designating weeks, days, and/or hours using the format 'Xw Xd Xh')
      plugins:
        type: string
        description: Comma separated list of plugin names. Plugins names should be importable Python modules.
      hpc:
        type: string
        enum:
        - Y
        - N
        description: Is MSNoise going to run on an HPC?
      output_folder:
        type: string
        description: Folder in which all the results will be output (base of the folder structure)
      fdsn_retries:
        type: integer
        description: Number of retry attempts for transient FDSN/EIDA network errors (timeout etc)
      fdsn_min_coverage:
        type: number
        description: Minimum fraction of the requested time window that must be returned by FDSN/EIDA for the job to succeed
          (0.0-1.0)
      fdsn_keep_raw:
        type: string
        enum:
        - Y
        - N
        description: 'Y: cache raw fetched waveforms to _output/raw/<date>/ for re-use by other preprocess configsets without
          re-fetching'
  ^preprocess_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      cc_sampling_rate:
        type: number
        description: Sampling Rate for the CrossCorrelation (in Hz)
      resampling_method:
        type: string
        enum:
        - Lanczos
        - Decimate
        description: Resampling method
      preprocess_lowpass:
        type: number
        description: Preprocessing Low-pass value (in Hz)
      preprocess_highpass:
        type: number
        description: Preprocessing High-pass value (in Hz)
      preprocess_max_gap:
        type: number
        description: Preprocessing maximum gap length that will be filled by interpolation (in seconds)
      preprocess_taper_length:
        type: number
        description: Duration of the taper applied at the beginning and end of trace during the preprocessing, to allow highpass
          filtering (in seconds)
      remove_response:
        type: string
        enum:
        - Y
        - N
        description: Remove instrument response
      response_prefilt:
        type: string
        description: Remove instrument correction pre-filter (in Hz, see <a href='https://docs.obspy.org/packages/autogen/obspy.core.trace.Trace.remove_response.html'
          target="_blank">ObsPy Doc</a> for what it means.)
      preprocess_components:
        type: string
        description: 'Components to preprocess: ``Z`` only is enough for ZZ Cross-Correlation (CC) jobs, while ``E,N,Z`` is
          needed if e.g. SC jobs are desired.'
  ^cc_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      cc_sampling_rate:
        type: number
        description: Sampling Rate for the CrossCorrelation (in Hz)
      cc_normalisation:
        type: string
        enum:
        - 'NO'
        - POW
        - MAX
        - ABSMAX
        description: Normalisation method for individual `corr_duration`) CCFs, default is not normalized (NO), but can be
          normalized based on the power of the two traces (POW), or by the maximum (MAX) or absolute maximum
      maxlag:
        type: number
        description: Maximum lag (in seconds)
      corr_duration:
        type: number
        description: Data windows to correlate (in seconds)
      overlap:
        type: number
        description: Amount of overlap between data windows [0:1]
      winsorizing:
        type: number
        description: Winsorizing at N time RMS , 0 disables winsorizing, -1 enables 1-bit normalization
      whitening:
        type: string
        enum:
        - A
        - N
        - C
        description: 'Whiten Traces before cross-correlation: [A]ll (except for autocorr), [N]one, or only if [C]omponents
          are different'
      whitening_type:
        type: string
        enum:
        - B
        - PSD
        - HANN
        description: 'Type of spectral whitening function to use: [B]rutal (amplitude to 1.0), divide spectrum by its [PSD]
          or by band-passing the white spectrum with a hanning-window [HANN]. WARNING: only works for comput'
      clip_after_whiten:
        type: string
        enum:
        - Y
        - N
        description: Do the clipping (winsorizing) after whitening?
      stack_method:
        type: string
        enum:
        - linear
        - pws
        - tfpws
        description: 'Stack Method: Linear Mean or Phase Weighted Stack or Time-Frequency Phase Weighted Stack'
      pws_timegate:
        type: number
        description: If ``stack_method`` ='pws', width of the smoothing (in seconds)
      pws_power:
        type: number
        description: If ``stack_method`` is ``pws`` or ``tfpws``, power of the coherence weight
      tfpws_nscales:
        type: integer
        description: Number of log-spaced CWT scales for tf-PWS daily stacking (``stack_method`` = tfpws only)
      components_to_compute:
        type: string
        description: List (comma separated) of components to compute between two different stations
      cc_type:
        type: string
        enum:
        - CC
        - PCC
        description: 'Cross-Correlation type: CC for classical FFT-based correlation ; PCC for Phase Crosse Correlation (FastPCC''s
          PCC2, Ventosa et al)'
      components_to_compute_single_station:
        type: string
        description: List (comma separated) of components within a single station. ZZ would be the autocorrelation of Z component,
          while ZE or ZN are the cross-components. Defaults to [], no single-station computations ar
      cc_type_single_station_AC:
        type: string
        enum:
        - CC
        - PCC
        description: Auto-Correlation type (same as for cc_type)
      cc_type_single_station_SC:
        type: string
        enum:
        - CC
        - PCC
        description: 'Cross-Correlation type for Cross-Components (same as for cc_type: CC or PCC)'
      keep_all:
        type: string
        enum:
        - Y
        - N
        description: 'Keep all cross-corr (length: ``corr_duration``)'
      keep_days:
        type: string
        enum:
        - Y
        - N
        description: Keep all daily cross-corr
      cc_taper_fraction:
        type: number
        description: 'Fraction of each trace to taper (cosine) before cross-correlation. Applied symmetrically to both ends.
          Standard seismological convention is 0.04 (4%). Range: 0.0 (no taper) to 0.5 (full Hann window).'
  ^filter_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      freqmin:
        type: number
        description: Lower frequency bound (Hz)
      freqmax:
        type: number
        description: Upper frequency bound (Hz)
      CC:
        type: string
        enum:
        - Y
        - N
        description: Compute cross-correlation between different stations
      SC:
        type: string
        enum:
        - Y
        - N
        description: Compute cross-correlation between different components of same station
      AC:
        type: string
        enum:
        - Y
        - N
        description: Compute auto-correlation from single station components
      used:
        type: string
        enum:
        - Y
        - N
        description: Whether this filter is active
  ^stack_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      stack_method:
        type: string
        enum:
        - linear
        - pws
        - tfpws
        description: 'Stack Method: Linear Mean or Phase Weighted Stack'
      pws_timegate:
        type: number
        description: If ``stack_method`` ='pws', width of the smoothing (in seconds)
      pws_power:
        type: number
        description: If ``stack_method`` ="pws", Power of the Weighting
      mov_stack:
        type: string
        description: 'A list of two parameters: the time to "roll" over (default 1 day) and the granularity (step) of the
          resulting stacked CCFs (default 1 day) to stack for the Moving-window stacks. This can be a list of '
      wienerfilt:
        type: string
        enum:
        - Y
        - N
        description: Apply wiener filter before stacking? Y[N]
      wiener_mlen:
        type: string
        description: Smoothing along date axis (time delta)
      wiener_nlen:
        type: string
        description: Smoothing along lag time axis (time delta)
      tfpws_nscales:
        type: integer
        description: Number of log-spaced CWT scales spanning freqmin–freqmax for tf-PWS stacking (``stack_method`` = tfpws
          only)
  ^refstack_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      ref_begin:
        type: string
        description: Start of REF period. Absolute date (YYYY-MM-DD) OR negative integer for rolling-index mode (e.g. -5 means
          5 windows before current)
      ref_end:
        type: string
        description: End of REF period. Absolute date (YYYY-MM-DD) OR negative integer (e.g. -1 means exclude self). Must
          be > ref_begin when both are negative.
      stack_method:
        type: string
        enum:
        - linear
        - pws
        - tfpws
        description: Stack method for REF computation (Mode A only)
      pws_timegate:
        type: number
        description: 'If stack_method=pws: smoothing width in seconds (Mode A only)'
      pws_power:
        type: number
        description: 'If stack_method=pws: power of the weighting (Mode A only)'
      wienerfilt:
        type: string
        enum:
        - Y
        - N
        description: Apply Wiener filter to daily CCFs before REF stacking (Mode A only). Y/N
      wiener_mlen:
        type: string
        description: Wiener smoothing along date axis (time delta, e.g. 24h)
      wiener_nlen:
        type: string
        description: Wiener smoothing along lag-time axis (time delta, e.g. 0.5s)
      tfpws_nscales:
        type: integer
        description: Number of log-spaced CWT scales spanning freqmin–freqmax for tf-PWS stacking (``stack_method`` = tfpws
          only)
  ^mwcs_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      freqmin:
        type: number
        description: The lower frequency bound to apply MWCS
      freqmax:
        type: number
        description: The upper frequency bound to apply MWCS
      mwcs_wlen:
        type: number
        description: Window length to perform MWCS
      mwcs_step:
        type: number
        description: Step of the windowing procedure in MWCS
  ^mwcs_dtt_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      dtt_minlag:
        type: number
        description: Minimum lag time
      dtt_width:
        type: number
        description: Width of the time lag window
      dtt_lag:
        type: string
        enum:
        - static
        - dynamic
        description: How is the lag window defined for MWCS
      dtt_v:
        type: number
        description: What velocity to use to avoid ballistic waves
      dtt_sides:
        type: string
        enum:
        - both
        - left
        - right
        description: Which sides to use
      dtt_mincoh:
        type: number
        description: Minimum coherence on dt measurement
      dtt_maxerr:
        type: number
        description: Maximum error on dt measurement
      dtt_maxdtt:
        type: number
        description: Maximum dt/t value
  ^mwcs_dtt_dvv_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      dvv_split_pair_type:
        type: string
        enum:
        - Y
        - N
        description: Split dv/v by pair type (CC/SC/AC) separately. CC=inter-station; SC=same station different location;
          AC=autocorrelation.
      dvv_split_components:
        type: string
        enum:
        - Y
        - N
        description: Split dv/v by component pair (ZZ/RR/TT/etc) separately.
      dvv_cc_value:
        type: string
        enum:
        - m
        - m0
        description: dv/v column to use for CC (inter-station) pairs. m=free-intercept slope; m0=forced-through-zero slope.
      dvv_cc_error:
        type: string
        enum:
        - em
        - em0
        description: 'Error column for CC pairs. Must match dvv_cc_value: em for m; em0 for m0.'
      dvv_sc_value:
        type: string
        enum:
        - m
        - m0
        description: 'dv/v column for SC (single-station different location) pairs. m0 recommended: no clock error expected.'
      dvv_sc_error:
        type: string
        enum:
        - em
        - em0
        description: Error column for SC pairs.
      dvv_ac_value:
        type: string
        enum:
        - m
        - m0
        description: 'dv/v column for AC (autocorrelation) pairs. m0 recommended: no clock error expected.'
      dvv_ac_error:
        type: string
        enum:
        - em
        - em0
        description: Error column for AC pairs.
      dvv_quality_min:
        type: number
        description: Minimum mean coherence (mcoh) to include a pair at a given time step. Set to 0 to disable.
      dvv_weighted_mean:
        type: string
        enum:
        - Y
        - N
        description: Compute 1/error^2 weighted mean across pairs.
      dvv_trimmed_mean:
        type: string
        enum:
        - Y
        - N
        description: 'Compute trimmed mean: reject pairs whose dv/v deviates more than dvv_trim_limit sigma from the mean.'
      dvv_trim_limit:
        type: number
        description: Sigma cutoff for trimmed mean.
      dvv_percentiles:
        type: string
        description: Comma-separated list of percentiles to save (e.g. 5,25,75,95).
      dvv_output_percent:
        type: string
        enum:
        - Y
        - N
        description: Output dv/v in percent (multiply slope by 100). If N output as fraction.
  ^stretching_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      stretching_minlag:
        type: number
        description: Minimum lag time
      stretching_width:
        type: number
        description: Width of the time lag window
      stretching_lag:
        type: string
        enum:
        - static
        - dynamic
        description: How the lag window is defined for stretching
      stretching_v:
        type: number
        description: What velocity to use to avoid ballistic waves
      stretching_sides:
        type: string
        enum:
        - both
        - left
        - right
        description: Which sides to use
      stretching_max:
        type: number
        description: Maximum stretching coefficient
      stretching_nsteps:
        type: integer
        description: Number of stretching steps
  ^stretching_dvv_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      dvv_split_pair_type:
        type: string
        enum:
        - Y
        - N
        description: Split dv/v by pair type (CC/SC/AC) separately. CC=inter-station; SC=same station different location;
          AC=autocorrelation.
      dvv_split_components:
        type: string
        enum:
        - Y
        - N
        description: Split dv/v by component pair (ZZ/RR/TT/etc) separately.
      dvv_quality_min:
        type: number
        description: Minimum cross-correlation coefficient (Coeff) between stretched reference and data. Pairs below this
          threshold at a given time step are excluded.
      dvv_weighted_mean:
        type: string
        enum:
        - Y
        - N
        description: Compute 1/Error^2 weighted mean across pairs. Error is the half-width at full maximum of the Gaussian
          fit.
      dvv_trimmed_mean:
        type: string
        enum:
        - Y
        - N
        description: 'Compute trimmed mean: reject pairs whose dv/v deviates more than dvv_trim_limit sigma from the mean.'
      dvv_trim_limit:
        type: number
        description: Sigma cutoff for trimmed mean.
      dvv_percentiles:
        type: string
        description: Comma-separated list of percentiles to save (e.g. 5,25,75,95).
      dvv_output_percent:
        type: string
        enum:
        - Y
        - N
        description: 'Output dv/v in percent: dv/v(%) = (Delta-1)*100. If N output as raw Delta-1 fraction.'
  ^wavelet_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      wct_freqmin:
        type: number
        description: The lower frequency bound to apply WCT
      wct_freqmax:
        type: number
        description: The upper frequency bound to apply WCT
      wct_ns:
        type: number
        description: Smoothing parameter in frequency
      wct_nt:
        type: number
        description: Smoothing parameter in time
      wct_vpo:
        type: number
        description: 'Voices per octave: controls the scale resolution of the CWT. Values of 10-12 are standard in ambient-noise
          WCT literature and give adequate time-frequency resolution for dv/v measurements. 20 (old def'
      wct_nptsfreq:
        type: integer
        description: Number of frequency points sampled linearly between wct_freqmin and wct_freqmax. Because adjacent wavelet
          scales are correlated over ~1/vpo octaves, having more points than ~vpo*(log2(freqmax/freqmin)
      wct_norm:
        type: boolean
        description: If the REF and CCF are normalized before computing wavelet
      wavelet_type:
        type: string
        description: Type of wavelet function used
      wct_compute_dtt:
        type: boolean
        description: When True (default), compute dt/t inline during the wavelet step using ALL downstream wavelet_dtt config
          sets, and write only the compact DTT/ERR/COH output — no intermediate WCT files are stored on d
  ^wavelet_dtt_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      wct_dtt_freqmin:
        type: number
        description: The lower frequency bound to compute the dv/v from the WCT
      wct_dtt_freqmax:
        type: number
        description: The upper frequency bound to compute the dv/v from the WCT
      wct_minlag:
        type: number
        description: Minimum lag time
      wct_width:
        type: number
        description: Width of the time lag window
      wct_lag:
        type: string
        enum:
        - static
        - dynamic
        description: How is the lag window defined for WCT
      wct_v:
        type: number
        description: Velocity parameter used for dynamic lag calculation
      wct_sides:
        type: string
        enum:
        - both
        - left
        - right
        description: Which sides to use
      wct_mincoh:
        type: number
        description: Minimum coherence on dt measurement
      wct_maxdt:
        type: number
        description: Maximum dt values
      wct_codacycles:
        type: integer
        description: Number of cycles of period
      wct_min_nonzero:
        type: number
        description: Percentage of data points with non-zero weighting
  ^wavelet_dtt_dvv_\d+$:
    type: object
    additionalProperties: false
    properties:
      after:
        oneOf:
        - type: string
        - type: array
          items:
            type: string
      dvv_freqmin:
        type: number
        description: Lower frequency bound (Hz) for dv/v extraction from the WCT-DTT output. Can be a subset of the parent
          wct_dtt computation band — enables multi-band analysis from one broadband WCT run.
      dvv_freqmax:
        type: number
        description: Upper frequency bound (Hz) for dv/v extraction. Multiple wavelet_dtt_dvv configsets with different freqmin/freqmax
          can be linked to the same wct_dtt step.
      dvv_freq_agg:
        type: string
        enum:
        - mean
        - median
        description: 'How to collapse the frequency dimension to a scalar dv/v time series: mean or median over the selected
